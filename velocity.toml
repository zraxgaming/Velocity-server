# ============================================================
# ZCRAFT NETWORK - VELOCITY CONFIG
# ============================================================

config-version = "2.7"

# Bind to your proxy port
bind = "0.0.0.0:14993"

# =========================
# SERVER LIST (MOTD)
# =========================
motd = """
<#00eaff><bold>ZCRAFT NETWORK</bold>
<gray>⚔ Lifesteal • Economy • Levels • Secure Auth
<#00ffaa>➤ Join now and dominate the leaderboard!
"""

show-max-players = 300

# =========================
# AUTHENTICATION
# =========================
online-mode = false
force-key-authentication = false

# Since you're cracked, disable this (VPN detection is weak anyway)
prevent-client-proxy-connections = false

# =========================
# IP FORWARDING
# =========================
player-info-forwarding-mode = "modern"
forwarding-secret-file = "forwarding.secret"

# IMPORTANT:
# Make sure your backend servers have:
# online-mode=false
# velocity-support enabled in paper.yml

# =========================
# FORGE SUPPORT
# =========================
announce-forge = false

kick-existing-players = true

# =========================
# PING SETTINGS
# =========================
ping-passthrough = "disabled"
sample-players-in-ping = true

enable-player-address-logging = false

# =========================
# SERVERS
# =========================
[servers]
lobby = "191.96.231.3:11339"

try = [
    "lobby"
]

# Change this to your real domain
[forced-hosts]
"zcraft.mcsh.io" = [
    "lobby"
]

# =========================
# ADVANCED SETTINGS
# =========================
[advanced]

compression-threshold = 256
compression-level = 6

login-ratelimit = 2000
connection-timeout = 8000
read-timeout = 30000

haproxy-protocol = false
tcp-fast-open = true

bungee-plugin-message-channel = true
show-ping-requests = false
failover-on-unexpected-server-disconnect = true
announce-proxy-commands = true
log-command-executions = false
log-player-connections = true
accepts-transfers = true

enable-reuse-port = true

# Command rate protection
command-rate-limit = 75
forward-commands-if-rate-limited = true
kick-after-rate-limited-commands = 15

tab-complete-rate-limit = 20
kick-after-rate-limited-tab-completes = 10

# =========================
# QUERY (Disabled for security)
# =========================
[query]
enabled = false
port = 25565
map = "ZCraft"
show-plugins = false
